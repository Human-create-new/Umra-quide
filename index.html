<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umra Guide</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #3f8368; --green-dark: #2b5f4a; --gold: #b8935a;
      --bg: #faf9f6; --text: #1f2420; --muted: #7a8079; --line: #ece7db;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Manrope', -apple-system, sans-serif; color: var(--text); background: var(--bg); }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    #panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: white; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      padding: 10px 14px 8px;
    }
    .brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .brand-row img { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; }
    .brand-row span { font-weight: 700; font-size: 13px; color: var(--green-dark); letter-spacing: 0.2px; }

    .city-switch { display: flex; background: var(--bg); border-radius: 14px; padding: 3px; margin-bottom: 10px; }
    .city-switch button {
      flex: 1; border: none; background: none; padding: 7px 0; border-radius: 11px;
      font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; color: var(--muted);
    }
    .city-switch button.active { background: var(--green); color: white; }

    .cat-row { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-item {
      background: none; border: none; white-space: nowrap; font-family: 'Manrope', sans-serif;
      font-weight: 600; font-size: 12.5px; color: var(--muted); padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }
    .cat-item.active { color: var(--green-dark); border-bottom-color: var(--green); }

    .debug-toggle {
      position: absolute; bottom: 14px; right: 14px; z-index: 2001;
      width: 34px; height: 34px; border-radius: 50%; background: white;
      border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 15px; opacity: 0.55;
    }
    #debug {
      display: none;
      position: absolute; bottom: 56px; left: 12px; right: 12px; z-index: 2000;
      background: rgba(20,20,20,0.92); color: #7fe0a0; font-size: 10px; font-family: monospace;
      padding: 8px; max-height: 30vh; overflow-y: auto; white-space: pre-wrap; border-radius: 8px;
    }
    #debug.visible { display: block; }

    /* маркеры-капли с иконкой категории */
    .marker-pin {
      width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
      background: white; border: 2px solid var(--green);
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: all 0.15s ease;
    }
    .marker-pin span { transform: rotate(45deg); font-size: 14px; }
    .marker-pin.selected {
      width: 40px; height: 40px; background: var(--green);
      box-shadow: 0 5px 12px rgba(0,0,0,0.35);
    }
    .marker-pin.selected span { font-size: 18px; }

    .popup-box { max-width: 250px; font-family: 'Manrope', sans-serif; }
    .popup-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .popup-title { font-weight: 700; font-size: 15px; color: var(--text); margin-bottom: 2px; }
    .heart-btn { background: none; border: none; font-size: 18px; padding: 0; line-height: 1; }
    .popup-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; margin: 4px 0 6px; }
    .popup-hours { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 8px; }

    .action-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .route-btn, .route-btn:visited, .route-btn:link {
      display: inline-block; background: var(--green); color: white !important;
      text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 11.5px;
      font-weight: 600; font-family: 'Manrope', sans-serif;
    }

    .rating-line { font-size: 12.5px; color: var(--text); margin-bottom: 6px; }
    .rating-line b { color: var(--gold); }

    .reviews-block { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
    .review-item { font-size: 12px; margin-bottom: 6px; color: var(--text); line-height: 1.4; }
    .leave-review-btn {
      background: none; border: none; color: var(--green-dark); font-weight: 700;
      font-size: 12px; padding: 4px 0; font-family: 'Manrope', sans-serif;
    }
    .review-form { display: none; margin-top: 8px; flex-direction: column; gap: 5px; }
    .review-form.open { display: flex; }
    .review-form select, .review-form textarea {
      font-size: 12px; padding: 6px; border: 1.5px solid var(--line); border-radius: 8px;
      font-family: 'Manrope', sans-serif;
    }
    .review-submit {
      background: var(--green-dark); color: white; border: none; border-radius: 8px;
      padding: 7px; font-size: 12px; font-weight: 600; font-family: 'Manrope', sans-serif;
    }
  </style>
</head>
<body>
  <div id="panel">
    <div class="brand-row">
      <img src="logo.png" onerror="this.style.display='none'">
      <span>Umra Guide</span>
    </div>
    <div class="city-switch" id="city-switch"></div>
    <div class="cat-row" id="category-row"></div>
  </div>

  <div id="map"></div>
  <div id="debug"></div>
  <button class="debug-toggle" onclick="document.getElementById('debug').classList.toggle('visible')">🐞</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SUPABASE_URL = "https://yhbmhqqhrvdtoiucrwxh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_fa30VjQuhLoSnmvrlfUiEQ_IdnQsIuZ";
    const CARTO_KEY = "cb1_2wjd_1_49134346db0663b43ee9dad5";

    const debugEl = document.getElementById('debug');
    function log(msg) { debugEl.textContent += "\n" + msg; }

    const CITIES = {
      mecca: { label: "Мекка", center: [21.4225, 39.8262] },
      medina: { label: "Медина", center: [24.4672, 39.6112] }
    };
    // текст без эмодзи — иконки теперь на маркерах карты
    const CATEGORIES = {
      all: "Все", food: "Еда", health: "Здоровье", shopping: "Магазины",
      connectivity: "Связь", money: "Деньги", transport: "Транспорт",
      religion: "Религия", useful: "Полезное"
    };
    const CATEGORY_ICONS = {
      food: "🍽", health: "💊", shopping: "🛒", connectivity: "📱",
      money: "💰", transport: "🚕", religion: "🕌", useful: "🏨"
    };

    let currentCity = "mecca";
    let currentCategory = "all";
    let allPlaces = [];
    let markers = [];
    let selectedMarker = null;
    let favoritePlaceIds = new Set();
    let accessToken = localStorage.getItem("ug_token");
    let userId = localStorage.getItem("ug_user_id");

    function makeIcon(category, selected) {
      const emoji = CATEGORY_ICONS[category] || "📍";
      const size = selected ? 40 : 30;
      return L.divIcon({
        className: '',
        html: `<div class="marker-pin ${selected ? 'selected' : ''}"><span>${emoji}</span></div>`,
        iconSize: [size, size],
        iconAnchor: [size / 2, size],
        popupAnchor: [0, -size]
      });
    }

    async function authenticate() {
      log("accessToken из localStorage: " + (accessToken ? "есть" : "нет"));
      if (accessToken && userId) { await loadFavorites(); return; }
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
      const initData = tg?.initData;
      log("initData: " + (initData ? "есть, длина " + initData.length : "ПУСТО"));
      if (!initData) { log("Нет initData — останавливаемся"); return; }
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/telegram-auth`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
          body: JSON.stringify({ initData })
        });
        log("HTTP статус ответа auth: " + res.status);
        const data = await res.json();
        if (data.access_token) {
          accessToken = data.access_token;
          userId = data.user_id;
          localStorage.setItem("ug_token", accessToken);
          localStorage.setItem("ug_user_id", userId);
          log("Авторизация успешна, userId=" + userId);
          await loadFavorites();
        } else { log("Ошибка авторизации: " + JSON.stringify(data)); }
      } catch (e) { log("Исключение при запросе: " + e.message); }
    }

    async function loadFavorites() {
      if (!accessToken) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/favorites?select=place_id`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      favoritePlaceIds = new Set(data.map(f => f.place_id));
    }

    async function toggleFavorite(placeId, btnEl) {
      if (!accessToken) { alert("Открой приложение через Telegram, чтобы сохранять места"); return; }
      if (favoritePlaceIds.has(placeId)) {
        await fetch(`${SUPABASE_URL}/rest/v1/favorites?place_id=eq.${placeId}&user_id=eq.${userId}`, {
          method: "DELETE",
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}` }
        });
        favoritePlaceIds.delete(placeId);
        btnEl.textContent = "🤍";
      } else {
        await fetch(`${SUPABASE_URL}/rest/v1/favorites`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`,
            "Content-Type": "application/json", Prefer: "return=minimal"
          },
          body: JSON.stringify({ user_id: userId, place_id: placeId })
        });
        favoritePlaceIds.add(placeId);
        btnEl.textContent = "❤️";
      }
    }

    async function loadReviews(placeId) {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/reviews?place_id=eq.${placeId}&status=eq.published&select=rating,text,created_at&order=created_at.desc`,
        { headers: { apikey: SUPABASE_KEY } }
      );
      return res.json();
    }

    async function submitReview(placeId, rating, text, statusEl) {
      if (!accessToken) { alert("Открой приложение через Telegram, чтобы оставить отзыв"); return; }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY, Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json", Prefer: "return=minimal"
        },
        body: JSON.stringify({ user_id: userId, place_id: placeId, rating: Number(rating), text, status: "pending" })
      });
      log("Отправка отзыва, статус: " + res.status);
      statusEl.textContent = res.status === 201 ? "Спасибо! Отзыв отправлен на модерацию." : "Ошибка отправки, попробуйте позже.";
    }

    const map = L.map('map', { zoomControl: false }).setView(CITIES[currentCity].center, 15);
    L.tileLayer(
      `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`,
      { attribution: '&copy; OpenStreetMap contributors, &copy; CARTO', subdomains: 'abcd', maxZoom: 20 }
    ).addTo(map);

    const citySwitchEl = document.getElementById('city-switch');
    Object.entries(CITIES).forEach(([key, city]) => {
      const btn = document.createElement('button');
      btn.className = key === currentCity ? 'active' : '';
      btn.textContent = city.label;
      btn.onclick = () => {
        currentCity = key;
        citySwitchEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        map.setView(CITIES[currentCity].center, 15);
        loadPlaces();
      };
      citySwitchEl.appendChild(btn);
    });

    const categoryRow = document.getElementById('category-row');
    Object.entries(CATEGORIES).forEach(([key, label]) => {
      const btn = document.createElement('button');
      btn.className = 'cat-item' + (key === currentCategory ? ' active' : '');
      btn.textContent = label;
      btn.onclick = () => {
        currentCategory = key;
        document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMarkers();
      };
      categoryRow.appendChild(btn);
    });

    function selectMarker(marker, category) {
      if (selectedMarker && selectedMarker !== marker) {
        selectedMarker.setIcon(makeIcon(selectedMarker._category, false));
      }
      marker.setIcon(makeIcon(category, true));
      selectedMarker = marker;
    }

    function renderMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      selectedMarker = null;
      const filtered = allPlaces.filter(p =>
        p.city === currentCity && (currentCategory === 'all' || p.category === currentCategory)
      );

      filtered.forEach(place => {
        const gmapsUrl = place.google_place_id
          ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(place.name)}&destination_place_id=${place.google_place_id}`
          : `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}`;
        const appleUrl = `https://maps.apple.com/?daddr=${place.lat},${place.lng}&q=${encodeURIComponent(place.name)}`;
        const yandexUrl = `https://yandex.ru/maps/?rtext=~${place.lat},${place.lng}&rtt=auto`;
        const isFav = favoritePlaceIds.has(place.id);

        const marker = L.marker([place.lat, place.lng], { icon: makeIcon(place.category, false) }).addTo(map);
        marker._category = place.category;

        marker.on('click', () => selectMarker(marker, place.category));
        marker.on('popupclose', () => {
          if (selectedMarker === marker) {
            marker.setIcon(makeIcon(place.category, false));
            selectedMarker = null;
          }
        });

        const ratingHtml = place.google_rating
          ? `<div class="rating-line">⭐ <b>${place.google_rating}</b> · ${place.google_rating_count ? place.google_rating_count + '+' : ''} отзывов в Google</div>`
          : '';

        const popupEl = document.createElement('div');
        popupEl.className = 'popup-box';
        popupEl.innerHTML = `
          <div class="popup-head">
            <div class="popup-title">${place.name}</div>
            <button class="heart-btn">${isFav ? '❤️' : '🤍'}</button>
          </div>
          <div class="popup-desc">${place.description || ''}</div>
          <div class="popup-hours">🕐 ${place.hours_text || 'не указано'}</div>
          <div class="action-row">
            <a class="route-btn" href="${gmapsUrl}" target="_blank">Google</a>
            <a class="route-btn" href="${appleUrl}" target="_blank">Apple</a>
            <a class="route-btn" href="${yandexUrl}" target="_blank">Яндекс</a>
          </div>
          ${ratingHtml}
          <div class="reviews-block">
            <div class="reviews-list">Загрузка отзывов...</div>
            <button class="leave-review-btn">✍️ Оставить отзыв</button>
            <div class="review-form">
              <select class="review-rating">
                <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option>
                <option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
              </select>
              <textarea class="review-text" placeholder="Ваш отзыв..." rows="2"></textarea>
              <button class="review-submit">Отправить отзыв</button>
              <div class="review-status" style="font-size:11px;color:#7a8079;"></div>
            </div>
          </div>
        `;

        popupEl.querySelector('.heart-btn').onclick = (e) => toggleFavorite(place.id, e.target);

        const reviewsListEl = popupEl.querySelector('.reviews-list');
        loadReviews(place.id).then(reviews => {
          reviewsListEl.innerHTML = reviews.length
            ? reviews.map(r => `<div class="review-item">${'⭐'.repeat(r.rating)} ${r.text || ''}</div>`).join('')
            : '<div class="review-item" style="color:#7a8079;">Пока нет отзывов паломников — будьте первым!</div>';
        });

        const formEl = popupEl.querySelector('.review-form');
        popupEl.querySelector('.leave-review-btn').onclick = () => formEl.classList.toggle('open');
        popupEl.querySelector('.review-submit').onclick = () => {
          const rating = popupEl.querySelector('.review-rating').value;
          const text = popupEl.querySelector('.review-text').value;
          submitReview(place.id, rating, text, popupEl.querySelector('.review-status'));
        };

        marker.bindPopup(popupEl);
        markers.push(marker);
      });
    }

    async function loadPlaces() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/places?select=*`, { headers: { apikey: SUPABASE_KEY } });
      allPlaces = await res.json();
      renderMarkers();
    }

    (async () => { await authenticate(); await loadPlaces(); })();
  </script>
</body>
</html>
