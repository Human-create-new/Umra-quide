<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umra Guide</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #controls {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      display: flex; flex-direction: column; gap: 6px;
    }
    .row { display: flex; gap: 6px; overflow-x: auto; }
    .btn {
      background: white; border: none; border-radius: 20px; padding: 8px 14px;
      font-size: 14px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .btn.active { background: #1a7a4c; color: white; }
    .route-btn, .route-btn:visited, .route-btn:link {
      display: inline-block; margin-top: 6px; background: #1a7a4c; color: white !important;
      text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px;
    }
    .fav-btn {
      display: inline-block; margin-top: 6px; margin-left: 6px; background: none;
      border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; font-size: 13px;
    }
    .fav-btn.active { background: #ffe6ea; border-color: #ff4d6d; }

    #debug {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2000;
      background: rgba(0,0,0,0.85); color: #0f0; font-size: 11px; font-family: monospace;
      padding: 8px; max-height: 35vh; overflow-y: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="row" id="city-row"></div>
    <div class="row" id="category-row"></div>
  </div>
  <div id="map"></div>
  <div id="debug">Загрузка...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
